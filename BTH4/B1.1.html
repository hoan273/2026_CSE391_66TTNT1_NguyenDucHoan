<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Bảng điểm sinh viên</title>

    <link rel="stylesheet" href="B1.1.css">

</head>

<body>

    <h2>Quản lý điểm sinh viên</h2>

    <input id="name" placeholder="Họ tên">
    <input id="score" placeholder="Điểm (0-10)">
    <button id="addBtn">Thêm</button>

    <table>
        <thead>
            <tr>
                <th>STT</th>
                <th>Họ tên</th>
                <th>Điểm</th>
                <th>Xếp loại</th>
                <th>Thao tác</th>
            </tr>
        </thead>

        <tbody id="tableBody">

        </tbody>
    </table>

    <div class="stats" id="stats"></div>

    <script src="B1.1.js"></script>

</body>

</html>
