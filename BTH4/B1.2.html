<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Quản lý sinh viên</title>
    <link rel="stylesheet" href="B1.2.css">
</head>

<body>

    <h2>Quản lý sinh viên</h2>

    <div class="add-box">
        <input id="name" placeholder="Họ tên">
        <input id="score" placeholder="Điểm (0-10)">
        <button id="addBtn">Thêm</button>
    </div>

    <div class="filter-box">
        <input id="search" placeholder="Tìm kiếm tên">

        <select id="filterRank">
            <option value="all">Tất cả</option>
            <option value="Giỏi">Giỏi</option>
            <option value="Khá">Khá</option>
            <option value="Trung bình">Trung bình</option>
            <option value="Yếu">Yếu</option>
        </select>
    </div>

    <table>

        <thead>
            <tr>
                <th>STT</th>
                <th>Họ tên</th>
                <th id="scoreHeader">Điểm</th>
                <th>Xếp loại</th>
                <th>Thao tác</th>
            </tr>
        </thead>

        <tbody id="tableBody"></tbody>

    </table>

    <p id="noResult"></p>

    <script src="B1.2.js"></script>

</body>

</html>
