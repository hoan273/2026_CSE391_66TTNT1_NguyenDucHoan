<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Form đặt hàng</title>
    <link rel="stylesheet" href="B2.2.css">
</head>

<body>
    <h2>Đặt hàng</h2>
    <form id="orderForm">

        <div class="field">
            <label>Tên sản phẩm</label>
            <select id="product">
                <option value="">-- Chọn sản phẩm --</option>
                <option value="Áo">Áo</option>
                <option value="Quần">Quần</option>
                <option value="Giày">Giày</option>
            </select>
            <small class="error" id="productError"></small>
        </div>

        <div class="field">
            <label>Số lượng</label>
            <input id="quantity" type="number">
            <small class="error" id="quantityError"></small>
        </div>

        <div class="field">
            <label>Ngày giao hàng</label>
            <input type="date" id="date">
            <small class="error" id="dateError"></small>
        </div>

        <div class="field">
            <label>Địa chỉ giao</label>
            <input id="address">
            <small class="error" id="addressError"></small>
        </div>

        <div class="field">
            <label>Ghi chú</label>
            <textarea id="note"></textarea>
            <div id="charCount">0/200</div>
            <small class="error" id="noteError"></small>
        </div>

        <div class="field">
            <label>Thanh toán</label>
            <input type="radio" name="pay" value="COD"> COD
            <input type="radio" name="pay" value="Bank"> Chuyển khoản
            <input type="radio" name="pay" value="Wallet"> Ví điện tử
            <small class="error" id="payError"></small>
        </div>

        <div class="total">
            Tổng tiền: <span id="total">0</span> VND
        </div>

        <button type="submit">Đặt hàng</button>

    </form>

    <div id="confirmBox">
        <h3>Xác nhận đặt hàng?</h3>
        <div id="summary"></div>
        <button id="confirmBtn">Xác nhận</button>
        <button id="cancelBtn">Hủy</button>
    </div>

    <h3 id="success"></h3>

    <script src="B2.2.js"></script>

</body>

</html>
